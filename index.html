<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MP3 Thumbnail Extension</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: linear-gradient(145deg, #f7faff 0%, #eef4fc 48%, #f8fbff 100%);
      color: #172033;
      margin: 0;
      padding: 20px;
    }

    .shell {
      width: 100%;
    }

    .hero {
      align-items: center;
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .app-icon {
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
      flex: 0 0 64px;
      height: 64px;
      width: 64px;
    }

    h1 {
      color: #0f172a;
      font-size: 21px;
      font-weight: 760;
      line-height: 1.3;
      margin: 0 0 4px;
    }

    p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .actions {
      display: grid;
      gap: 11px;
      grid-template-columns: 1fr;
      margin-bottom: 16px;
    }

    button {
      align-items: center;
      background: #fff;
      border: 1px solid #d6e0ef;
      border-radius: 12px;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      gap: 12px;
      justify-content: flex-start;
      min-height: 54px;
      padding: 12px 14px;
      text-align: left;
      transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      width: 100%;
    }

    button::before {
      align-items: center;
      border-radius: 6px;
      display: inline-flex;
      flex: 0 0 30px;
      font-size: 16px;
      height: 30px;
      justify-content: center;
      width: 30px;
    }

    #selected::before {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      content: "✓";
    }

    #all::before {
      background: #edf4ff;
      color: #2563eb;
      content: "↻";
    }

    #stop {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #475569;
      display: none;
    }

    #stop::before {
      background: #e2e8f0;
      color: #64748b;
      content: "■";
      font-size: 11px;
    }

    #stop.is-visible {
      display: flex;
    }

    #stop.is-pending {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #9a3412;
    }

    #stop.is-pending::before {
      background: #ffedd5;
      color: #ea580c;
    }

    button:hover {
      background: #f8fbff;
      border-color: #9eb8dc;
      box-shadow: 0 4px 14px rgba(21, 94, 239, 0.10);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-color: #1d4ed8;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.24);
      color: #fff;
    }

    button.primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      border-color: #004eeb;
    }

    button:disabled {
      cursor: default;
      opacity: 0.6;
    }

  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <img class="app-icon" src="logo.png" alt="">
      <div>
        <h1>MP3 Thumbnail Extension</h1>
        <p>Extract embedded artwork and use it as MP3 thumbnails.</p>
      </div>
    </div>
    <div class="actions">
      <button id="selected" class="primary" type="button">Apply to Selected MP3s</button>
      <button id="all" type="button">Apply to All MP3s</button>
      <button id="stop" type="button">Cancel</button>
    </div>
  </div>
  <script src="js/plugin.js"></script>
</body>
</html>
